
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jung-Consult – Automobile und Beratung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #151515;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 65px 20px 35px; }
    h1 { font-size: 36px; margin-bottom: 12px; }
    .subtitle { color: #bcbcbc; font-size: 18px; }
    main { max-width: 900px; margin: auto; padding: 25px; }
    h2 { font-weight: normal; margin-bottom: 30px; }
    .brands {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 170px;
      padding: 25px;
      background: #252525;
      border: 1px solid #444;
      border-radius: 12px;
      color: white;
      text-decoration: none;
    }
    .brand:hover { background: #383838; }
    .brand span { font-size: 25px; font-weight: bold; }
    footer { padding: 55px 20px; color: #aaa; }
    footer a { color: white; }
    @media (max-width: 480px) {
      h1 { font-size: 27px; }
      .brands { gap: 10px; }
      .brand { min-height: 120px; padding: 12px; }
      .brand span { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Jung-Consult</h1>
    <p class="subtitle">Automobile und Beratung</p>
  </header>

  <main>
    <h2>Unsere Fahrzeugmarken</h2>
    <div class="brands">
      <a class="brand" href="porsche.html">
        <span>Porsche</span>
      </a>
      <a class="brand" href="mercedes.html">
        <span>Mercedes-Benz</span>
      </a>
      <a class="brand" href="volkswagen.html">
        <span>Volkswagen</span>
      </a>
      <a class="brand" href="gmc.html">
        <span>GMC</span>
      </a>
    </div>
  </main>

  <footer>
    <p>Jung-Consult – Automobile und Beratung</p>
    <p>Kontakt: jung-consult@gmx.de</p>
    <p><a href="impressum.html">Impressum</a></p>
  </footer>
</body>
</html>
