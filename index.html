<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jung consult – Automobile und Beratung</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101114;
      color: #f4f1eb;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 65px 20px 35px; }
    h1 {
      color: #d4b879;
      font-size: 40px;
      margin-bottom: 12px;
      font-weight: normal;
      letter-spacing: 2px;
    }
    .subtitle { color: #bcbcbc; font-size: 18px; }
    main { max-width: 900px; margin: auto; padding: 25px; }
    h2 {
      color: #d4b879;
      font-weight: normal;
      margin-bottom: 30px;
    }
    .brands {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 190px;
      padding: 25px;
      background: #202125;
      border: 1px solid #514735;
      border-radius: 12px;
      color: #f4f1eb;
      text-decoration: none;
      transition: 0.2s;
    }
    .brand:hover {
      background: #303034;
      border-color: #d4b879;
    }
    .brand img {
      width: 105px;
      height: 85px;
      object-fit: contain;
    }
    .brand span { font-size: 20px; }
    footer {
      padding: 55px 20px;
      color: #aaa;
      line-height: 1.9;
    }
    footer a { color: #d4b879; }
    .legal a { margin: 0 12px; }
    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .brands { gap: 12px; }
      .brand { min-height: 145px; padding: 12px; }
      .brand img { width: 75px; height: 65px; }
      .brand span { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>jung consult</h1>
    <p class="subtitle">Automobile und Beratung</p>
  </header>

  <main>
    <h2>Unsere Fahrzeugmarken</h2>
    <div class="brands">
      <a class="brand" href="porsche.html">
        <img src="https://cdn.simpleicons.org/porsche/D4B879"
             alt="Porsche Logo">
        <span>Porsche</span>
      </a>

      <a class="brand" href="mercedes.html">
        <img src="https://cdn.simpleicons.org/mercedes/D4B879"
             alt="Mercedes-Benz Logo">
        <span>Mercedes-Benz</span>
      </a>

      <a class="brand" href="volkswagen.html">
        <img src="https://cdn.simpleicons.org/volkswagen/D4B879"
             alt="Volkswagen Logo">
        <span>Volkswagen</span>
      </a>

      <a class="brand" href="gmc.html">
        <img src="https://cdn.simpleicons.org/gmc/D4B879"
             alt="GMC Logo">
        <span>GMC</span>
      </a>
    </div>
  </main>

  <footer>
    <p>jung consult – Automobile und Beratung</p>
    <p>Kontakt:
      <a href="mailto:jung-consult@gmx.de">
        jung-consult@gmx.de
      </a>
    </p>
    <p class="legal">
      <a href="impressum.html">Impressum</a>
      <a href="datenschutz.html">Datenschutz</a>
    </p>
  </footer>
</body>
</html>
