
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fahrzeug | jung-consult</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #151515;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    header {
      text-align: center;
      padding: 40px 20px;
    }

    header a, footer a {
      color: #d4b879;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;
    }

    h2 {
      color: #d4b879;
      font-size: 22px;
      font-weight: normal;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .bilder {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .bilder img {
      width: 100%;
      border-radius: 8px;
    }

    .daten {
      background: #242424;
      padding: 25px;
      border-radius: 8px;
      margin: 25px 0;
    }

    .status {
      color: #d4b879;
      font-size: 20px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
    }
  </style>
</head>
<body>

<header>
  <p><a href="javascript:history.back()">
    ← Zurück
  </a></p>
  <h1 id="titel">Fahrzeug wird geladen ...</h1>
</header>

<main id="inhalt"></main>

<footer>
  <a href="index.html">Startseite</a>
  ·
  <a href="impressum.html">Impressum</a>
  ·
  <a href="datenschutz.html">Datenschutz</a>
</footer>

<script>
async function ladeFahrzeug() {
  const id = new URLSearchParams(
    window.location.search
  ).get("id");

  const inhalt = document.getElementById("inhalt");
  const titel = document.getElementById("titel");

  if (!id) {
    titel.textContent = "Kein Fahrzeug ausgewählt";
    return;
  }

  try {
    const antwort = await fetch("fahrzeuge.json");
    if (!antwort.ok) throw new Error("Ladefehler");

    const fahrzeuge = await antwort.json();
    const auto = fahrzeuge.find(f => f.id === id);

    if (!auto) {
      titel.textContent = "Fahrzeug nicht gefunden";
      return;
    }

    titel.textContent = auto.titel || "Fahrzeug";
    document.title = titel.textContent + " | jung-consult";

    if (auto.fotos?.length) {
      const bilder = document.createElement("div");
      bilder.className = "bilder";

      for (const foto of auto.fotos) {
        const bild = document.createElement("img");
        bild.src = foto;
        bild.alt = auto.titel || "Fahrzeug";
        bilder.appendChild(bild);
      }

      inhalt.appendChild(bilder);
    }

    const daten = document.createElement("div");
    daten.className = "daten";

    const details = [
      ["Hersteller", auto.marke],
      ["Modell", auto.modell],
      ["Baujahr", auto.baujahr],
      ["Kilometerstand",
        auto.kilometerstand != null
          ? Number(auto.kilometerstand)
              .toLocaleString("de-DE") + " km"
          : null]
    ];

    for (const [bezeichnung, wert] of details) {
      if (wert == null || wert === "") continue;

      const zeile = document.createElement("p");
      const stark = document.createElement("strong");
      stark.textContent = bezeichnung + ": ";
      zeile.appendChild(stark);
      zeile.appendChild(document.createTextNode(wert));
      daten.appendChild(zeile);
    }

    const status = document.createElement("p");
    status.className = "status";

    if (auto.verkauft) {
      status.textContent = "Verkauft";
    } else if (auto.preis != null) {
      status.textContent =
        Number(auto.preis).toLocaleString("de-DE") + " €";
    }

    daten.appendChild(status);
    inhalt.appendChild(daten);

    for (const [ueberschrift, text] of [
      ["Fahrzeugbeschreibung", auto.beschreibung],
      ["Technische Instandsetzungen", auto.instandsetzungen]
    ]) {
      if (!text) continue;

      const abschnitt = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = ueberschrift;

      const p = document.createElement("p");
      p.textContent = text;
      p.style.whiteSpace = "pre-line";

      abschnitt.appendChild(h2);
      abschnitt.appendChild(p);
      inhalt.appendChild(abschnitt);
    }

  } catch (fehler) {
    titel.textContent =
      "Fahrzeug konnte nicht geladen werden";
  }
}

ladeFahrzeug();
</script>

</body>
</html>
